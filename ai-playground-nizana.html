<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LLM Valuation Lab · Israeli CFO Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --bg2:#ede8db; --surface:#ffffff; --surface2:#faf7ef;
  --ink:#1a1a1a; --ink2:#3a3a3a; --soft:#6a6a6a; --muted:#8a8a8a;
  --gold:#9a7209; --gold2:#c49a1f; --goldL:#e6d089; --goldXL:#f9efce;
  --navy:#0c405b; --navy2:#155d80; --navyL:#cde0ec;
  --green:#2c6e49; --greenL:#d6ead9; --red:#a83a3a; --redL:#f4dada;
  --amber:#b97f08; --amberL:#fcebbf;
  --border:#d9d4c5; --borderD:#bcb59c;
  --shadow:0 1px 3px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
  --shadowL:0 12px 40px rgba(0,0,0,.12);
  --r:14px; --r2:22px; --t:.22s cubic-bezier(.4,0,.2,1);
  --font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --serif:'Fraunces','Iowan Old Style',Georgia,serif;
  --mono:'JetBrains Mono','Cascadia Code','SF Mono',monospace;
}
[data-theme="dark"]{
  --bg:#13130f; --bg2:#1a1a14; --surface:#1f1f17; --surface2:#262620;
  --ink:#f5f1e6; --ink2:#d8d2c0; --soft:#a8a195; --muted:#7a7568;
  --gold:#d4a937; --gold2:#e3bf5a; --goldL:#5a4810; --goldXL:#3a2f08;
  --navy:#5fa8d4; --navy2:#7bb9df; --navyL:#1a3445;
  --green:#5ba776; --greenL:#1d3a26; --red:#d97373; --redL:#3a1d1d;
  --amber:#d9a13a; --amberL:#3d2c08;
  --border:#3a3a30; --borderD:#5a5a4a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg2);color:var(--ink);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;transition:background .3s ease,color .3s ease}
::selection{background:var(--goldL);color:#3a2a08}
[data-theme="dark"] ::selection{background:var(--gold);color:#1a1a1a}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--borderD)}

/* SIDEBAR */
.sidebar{width:288px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:20;box-shadow:1px 0 8px rgba(0,0,0,.03)}
.brand{padding:22px 22px 16px;background:linear-gradient(135deg,rgba(154,114,9,.08) 0%,transparent 70%);border-bottom:1px solid var(--border)}
.brand-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:1.05rem;box-shadow:0 4px 12px rgba(12,64,91,.25)}
.brand-title{font-family:var(--serif);font-size:1.18rem;font-weight:700;letter-spacing:-.4px;color:var(--navy)}
[data-theme="dark"] .brand-title{color:var(--gold)}
.brand-sub{font-size:.7rem;color:var(--soft);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.progress-block{padding:16px 22px;border-bottom:1px solid var(--border)}
.progress-row{display:flex;align-items:center;gap:14px}
.ring{width:54px;height:54px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--gold) calc(var(--pct,0)*1%),var(--bg2) 0);display:flex;align-items:center;justify-content:center;position:relative;transition:background .6s ease}
.ring::before{content:'';position:absolute;inset:5px;background:var(--surface);border-radius:50%}
.ring-label{position:relative;font-weight:700;font-size:.78rem;color:var(--gold)}
.progress-text{font-size:.78rem;color:var(--soft)}
.progress-text strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:2px;font-family:var(--serif)}
.streak{margin-top:10px;padding:6px 10px;background:var(--goldXL);border-radius:8px;display:flex;align-items:center;gap:6px;font-size:.75rem;color:#5a3e08;font-weight:600}
[data-theme="dark"] .streak{color:var(--gold2)}
.module-list{flex:1;overflow-y:auto;padding:10px 0}
.mod-item{padding:11px 22px 11px 19px;cursor:pointer;display:flex;align-items:center;gap:11px;border-left:3px solid transparent;transition:all var(--t);color:var(--ink2);font-size:.86rem;font-weight:500;position:relative}
.mod-item:hover{background:var(--surface2);color:var(--ink)}
.mod-item.active{background:var(--goldXL);border-left-color:var(--gold);color:#3a2a08;font-weight:600}
[data-theme="dark"] .mod-item.active{color:var(--gold2)}
.mod-item.completed .mod-num{background:var(--green);color:#fff;border-color:var(--green)}
.mod-item.completed{color:var(--soft)}
.mod-num{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--soft);transition:all var(--t);flex-shrink:0}
.mod-item.active .mod-num{background:var(--gold);border-color:var(--gold);color:#fff}
.mod-meta{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.mod-title-text{font-size:.86rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-time{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sidebar-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.tool-chip{flex:1;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:.72rem;font-weight:600;color:var(--ink2);cursor:pointer;transition:all var(--t);display:flex;align-items:center;justify-content:center;gap:5px;min-width:80px}
.tool-chip:hover{background:var(--goldXL);border-color:var(--goldL);color:#3a2a08}
[data-theme="dark"] .tool-chip:hover{color:var(--gold2)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:14px 32px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-shrink:0}
.topbar-l{display:flex;flex-direction:column;gap:2px}
.topbar h1{font-family:var(--serif);font-size:1.26rem;color:var(--ink);letter-spacing:-.5px;font-weight:600}
.topbar-crumbs{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.topbar-r{display:flex;align-items:center;gap:10px}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--t);font-size:1rem;color:var(--ink2)}
.icon-btn:hover{background:var(--goldXL);border-color:var(--goldL);transform:translateY(-1px)}
.score-pill{background:linear-gradient(135deg,var(--goldXL),#fdf7e8);border:1.5px solid var(--goldL);border-radius:24px;padding:7px 16px;font-weight:700;font-size:.82rem;color:#5a3e08;display:flex;align-items:center;gap:6px}
[data-theme="dark"] .score-pill{color:var(--gold2)}
.score-pill .star{font-size:.95rem;animation:starpulse 2s ease infinite}
@keyframes starpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:32px 40px 80px;background:var(--bg)}
.content-inner{max-width:980px;margin:0 auto}
.module-view{display:none;animation:fadeUp .4s cubic-bezier(.4,0,.2,1)}
.module-view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.mod-hero{background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--border);border-radius:var(--r2);padding:28px 32px;margin-bottom:24px;position:relative;overflow:hidden}
.mod-hero::before{content:'';position:absolute;top:-30%;right:-10%;width:280px;height:280px;background:radial-gradient(circle,rgba(154,114,9,.1) 0%,transparent 65%);pointer-events:none}
.mod-hero-tag{display:inline-block;padding:4px 12px;background:var(--navyL);color:var(--navy);border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px}
.mod-hero h2{font-family:var(--serif);font-size:1.85rem;line-height:1.2;color:var(--ink);margin-bottom:10px;font-weight:700;letter-spacing:-.6px}
.mod-hero p{font-size:1rem;color:var(--ink2);max-width:680px}
.mod-hero-stats{display:flex;gap:24px;margin-top:20px;flex-wrap:wrap}
.stat-item{display:flex;flex-direction:column;gap:2px}
.stat-item-num{font-family:var(--serif);font-size:1.4rem;font-weight:700;color:var(--gold)}
.stat-item-label{font-size:.7rem;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;font-weight:600}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin:16px 0;box-shadow:var(--shadow);transition:all var(--t)}
.card:hover{box-shadow:0 6px 24px rgba(0,0,0,.07)}
.card h3{font-family:var(--serif);font-size:1.2rem;margin-bottom:8px;color:var(--ink);font-weight:600;letter-spacing:-.3px}
.card h4{font-size:.97rem;margin-bottom:8px;color:var(--ink);font-weight:700}
.card p{margin-bottom:8px}
.card p:last-child{margin-bottom:0}
.card ul,.card ol{margin:8px 0 8px 22px}
.card li{margin-bottom:4px;font-size:.92rem}
.card-accent{border-left:4px solid var(--gold)}
.card-navy{border-left:4px solid var(--navy)}
.card-warn{background:var(--amberL);border-color:#e3c46a;border-left:4px solid var(--amber)}
[data-theme="dark"] .card-warn{color:var(--ink)}
.card-warn h4{color:#5a3e08}
[data-theme="dark"] .card-warn h4{color:var(--gold2)}
.card-info{background:var(--navyL);border-color:#9bbed4;border-left:4px solid var(--navy)}
.card-info h4{color:var(--navy)}
.card-success{background:var(--greenL);border-left:4px solid var(--green)}
.card-success h4{color:var(--green)}
.card-danger{background:var(--redL);border-left:4px solid var(--red)}
.card-danger h4{color:var(--red)}
.kp{background:var(--surface2);border-left:3px solid var(--gold);padding:12px 16px;margin:12px 0;border-radius:0 10px 10px 0;font-size:.93rem}
.kp-label{font-weight:700;color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}

/* TABLES */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:.86rem;background:var(--surface);border-radius:10px;overflow:hidden}
.tbl th,.tbl td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
.tbl th{background:var(--surface2);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover{background:var(--surface2)}
.tbl .num{font-family:var(--mono);text-align:right;font-weight:500}

/* EXERCISES */
.ex{background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);border:1.5px solid var(--border);border-radius:var(--r);padding:22px 24px;margin:20px 0;position:relative;transition:all var(--t)}
.ex.solved{border-color:var(--green);background:linear-gradient(135deg,var(--surface) 0%,var(--greenL) 100%)}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.ex-title{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.ex-icon{width:30px;height:30px;border-radius:8px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;font-weight:700}
.ex.solved .ex-icon{background:var(--green)}
.ex h4{margin:0;font-size:.98rem;color:var(--ink);font-weight:700}
.ex-pts{padding:4px 10px;background:var(--goldXL);color:#5a3e08;border-radius:14px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
[data-theme="dark"] .ex-pts{color:var(--gold2)}
.ex p,.ex .prompt{margin:8px 0;font-size:.92rem;color:var(--ink2)}
.ex-instructions{background:var(--bg);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:.86rem;color:var(--ink2);border:1px dashed var(--border)}
.opts label{display:block;padding:10px 14px;margin:6px 0;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:.9rem;transition:all var(--t);position:relative}
.opts label:hover{border-color:var(--gold);background:var(--goldXL)}
.opts label.picked{border-color:var(--gold);background:var(--goldXL);font-weight:600}
.opts label.right{border-color:var(--green);background:var(--greenL);font-weight:600}
.opts label.wrong{border-color:var(--red);background:var(--redL)}
.opts input{margin-right:8px;accent-color:var(--gold)}
.opts label.disabled{opacity:.6;cursor:not-allowed}
input[type="text"],input[type="number"],textarea,select{padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:var(--mono);font-size:.86rem;background:var(--surface);color:var(--ink);transition:all var(--t);width:100%}
input[type="text"]:focus,input[type="number"]:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--goldXL)}
textarea{font-family:var(--font);min-height:90px;resize:vertical;line-height:1.55}
input.input-sm{max-width:160px;display:inline-block}
.input-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.input-label{font-size:.82rem;font-weight:600;color:var(--ink2);min-width:140px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:24px;font-weight:700;font-size:.82rem;cursor:pointer;border:none;transition:all var(--t);font-family:var(--font);letter-spacing:.2px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-p{background:var(--navy);color:#fff}
.btn-p:hover{background:var(--navy2)}
.btn-g{background:var(--gold);color:#fff}
.btn-g:hover{background:#7a5c07}
.btn-o{background:var(--surface);border:1.5px solid var(--border);color:var(--ink)}
.btn-o:hover{border-color:var(--gold);background:var(--goldXL)}
.btn-ghost{background:transparent;color:var(--gold);padding:7px 14px;border:1.5px dashed var(--goldL)}
.btn-ghost:hover{background:var(--goldXL);border-style:solid}
.btn-sm{padding:6px 14px;font-size:.76rem}
.ex-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.feedback{margin-top:10px;padding:10px 14px;border-radius:10px;font-weight:500;font-size:.88rem;display:none;animation:fadeUp .3s ease}
.feedback.show{display:block}
.feedback.ok{background:var(--greenL);color:var(--green);border:1px solid #9ec7a6}
.feedback.bad{background:var(--redL);color:var(--red);border:1px solid #d99c9c}
.feedback.warn{background:var(--amberL);color:#5a3e08;border:1px solid #d6b96a}
[data-theme="dark"] .feedback.warn{color:var(--gold2)}

/* HINTS & SOLUTIONS */
.hint-stack{margin-top:10px}
.hint{background:var(--bg2);border:1px dashed var(--borderD);padding:10px 14px;border-radius:10px;font-size:.85rem;color:var(--ink2);margin-bottom:6px;animation:slideDown .3s ease;line-height:1.55}
.hint-label{font-weight:700;color:var(--gold);font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;margin-right:6px}
@keyframes slideDown{from{opacity:0;max-height:0;padding-top:0;padding-bottom:0;margin-bottom:0}to{opacity:1;max-height:300px}}
.solution{background:var(--navyL);border:1px solid #9bbed4;padding:14px 16px;border-radius:10px;margin-top:10px;font-size:.86rem;line-height:1.6;color:var(--navy);animation:fadeUp .35s ease}
[data-theme="dark"] .solution{color:var(--ink)}
.solution-label{font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;color:var(--navy)}
.solution code,.hint code{background:rgba(154,114,9,.13);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:.82em}

/* DRAG & DROP */
.dnd-grid{display:grid;gap:14px;margin:14px 0}
.dnd-source{background:var(--surface2);border:2px dashed var(--borderD);border-radius:12px;padding:12px;min-height:90px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.dnd-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.dnd-zone{background:var(--surface);border:2px dashed var(--border);border-radius:12px;padding:14px;min-height:100px;transition:all var(--t)}
.dnd-zone-head{font-size:.78rem;font-weight:700;color:var(--ink2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.dnd-zone-body{display:flex;flex-wrap:wrap;gap:8px;min-height:50px}
.dnd-zone.over{border-color:var(--gold);background:var(--goldXL);transform:scale(1.02)}
.dnd-zone.right{border-color:var(--green);background:var(--greenL)}
.dnd-zone.right .dnd-zone-head{color:var(--green)}
.dnd-zone.wrong{border-color:var(--red);background:var(--redL)}
.dnd-item{background:var(--surface);border:1.5px solid var(--gold);color:#3a2a08;border-radius:20px;padding:7px 14px;font-size:.82rem;font-weight:600;cursor:grab;transition:all var(--t);user-select:none}
[data-theme="dark"] .dnd-item{color:var(--gold2);background:var(--goldXL)}
.dnd-item:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.dnd-item:active{cursor:grabbing;opacity:.6}

/* SLIDERS */
.slider-row{display:grid;grid-template-columns:1fr 1.5fr 70px;gap:14px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border)}
.slider-row:last-child{border-bottom:none}
.slider-label{display:flex;flex-direction:column;gap:2px}
.slider-label-name{font-size:.82rem;font-weight:600;color:var(--ink2)}
.slider-label-help{font-size:.72rem;color:var(--muted)}
input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:var(--bg2);border-radius:6px;outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;background:var(--gold);border-radius:50%;cursor:pointer;border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform var(--t)}
input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type="range"]::-moz-range-thumb{width:18px;height:18px;background:var(--gold);border-radius:50%;cursor:pointer;border:2px solid var(--surface)}
.slider-val{font-family:var(--mono);font-weight:700;font-size:.85rem;color:var(--gold);background:var(--goldXL);padding:5px 8px;border-radius:6px;text-align:center}
[data-theme="dark"] .slider-val{color:var(--gold2)}

/* LIVE OUTPUT */
.live-out{background:var(--ink);color:#f5f1e6;border-radius:12px;padding:18px;font-family:var(--mono);font-size:.84rem;line-height:1.7;margin:14px 0;position:relative;overflow:auto}
[data-theme="dark"] .live-out{background:#0a0a08}
.live-out-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #444}
.live-out-title{color:#c49a1f;font-weight:700;font-size:.78rem;letter-spacing:.5px;text-transform:uppercase}
.live-out-line{display:flex;justify-content:space-between;padding:3px 0;gap:14px}
.live-out-line.total{font-weight:700;color:var(--gold2);margin-top:8px;padding-top:10px;border-top:1px solid #555}
.live-out-line .v{color:#a8c4d8;text-align:right}

/* HEATMAP */
.heatmap{display:grid;gap:1px;margin:14px 0;background:var(--border);border-radius:10px;overflow:hidden}
.heat-cell{padding:9px 6px;text-align:center;font-family:var(--mono);font-size:.78rem;background:var(--surface);transition:all var(--t)}
.heat-cell.head{background:var(--surface2);font-weight:700;color:var(--ink2);font-size:.72rem}
.heat-cell.label{background:var(--surface2);font-weight:700;font-size:.72rem;color:var(--ink2)}

/* BUILDER ROWS */
.builder-row{display:grid;grid-template-columns:2fr 1fr 1fr 30px;gap:8px;padding:8px;background:var(--surface2);border-radius:8px;margin-bottom:6px;align-items:center}
.builder-row input{padding:7px 10px;font-size:.82rem}
.builder-row .x-btn{background:transparent;border:none;color:var(--red);cursor:pointer;font-size:1.05rem;padding:4px;border-radius:4px}
.builder-row .x-btn:hover{background:var(--redL)}

/* TOAST */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--green);color:#fff;padding:12px 22px;border-radius:24px;font-weight:600;font-size:.85rem;box-shadow:var(--shadowL);animation:toastIn .4s cubic-bezier(.4,0,.2,1) forwards,toastOut .4s ease 2.4s forwards;display:flex;align-items:center;gap:8px;pointer-events:auto;max-width:380px}
.toast.gold{background:linear-gradient(135deg,var(--gold),#b88a16)}
.toast.navy{background:linear-gradient(135deg,var(--navy),var(--navy2))}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{to{transform:translateX(120%);opacity:0}}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(20,20,20,.5);backdrop-filter:blur(4px);z-index:998;display:none;animation:fadeIn .25s ease}
.overlay.open{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--surface);border-radius:16px;box-shadow:var(--shadowL);z-index:999;max-width:760px;width:92%;max-height:84vh;overflow:hidden;display:none;flex-direction:column;animation:modalIn .35s cubic-bezier(.4,0,.2,1)}
.modal.open{display:flex}
@keyframes modalIn{from{transform:translate(-50%,-46%) scale(.94);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--surface2)}
.modal-head h3{font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--ink);letter-spacing:-.3px}
.modal-body{padding:22px 24px;overflow-y:auto}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.05rem;color:var(--soft);transition:all var(--t)}
.modal-close:hover{background:var(--redL);color:var(--red);border-color:var(--red)}
.modal-body dt{font-weight:700;margin:14px 0 4px;color:var(--gold);font-family:var(--font)}
.modal-body dd{margin-left:0;font-size:.9rem;color:var(--ink2);line-height:1.55}

/* MODULE NAV */
.mod-nav{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:32px;padding-top:24px;border-top:1px solid var(--border)}
.mod-nav .btn{padding:11px 22px;font-size:.85rem}

/* SANITIZE */
.sanitize-out{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin:10px 0;font-size:.88rem;line-height:1.7;min-height:80px}
.flag{background:var(--redL);color:var(--red);padding:1px 6px;border-radius:4px;font-weight:600;text-decoration:line-through;cursor:help;position:relative}
.flag-clean{background:var(--greenL);color:var(--green);padding:1px 6px;border-radius:4px;text-decoration:none;font-style:italic}

/* CONFETTI */
.confetti{position:fixed;pointer-events:none;z-index:10000;top:0;left:0;width:100vw;height:100vh;overflow:hidden;display:none}
.confetti.go{display:block}
.confetti span{position:absolute;width:8px;height:14px;opacity:0;top:-30px;animation:fall 2.4s ease-out forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}

/* TIPS & MISC */
.tip{background:linear-gradient(135deg,var(--goldXL) 0%,#fdfaf3 100%);border:1px solid var(--goldL);border-left:4px solid var(--gold);border-radius:10px;padding:14px 18px;margin:14px 0;font-size:.88rem;color:var(--ink2);position:relative}
[data-theme="dark"] .tip{color:var(--ink)}
.tip-label{font-weight:700;color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.divider{height:1px;background:linear-gradient(to right,transparent,var(--border),transparent);margin:24px 0;border:none}
.section-title{font-family:var(--serif);font-size:1.32rem;color:var(--ink);margin:24px 0 8px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:6px;height:24px;background:var(--gold);border-radius:3px}
.subsection{font-family:var(--serif);font-size:1.05rem;margin:18px 0 8px;color:var(--ink);font-weight:600}
pre.code{background:var(--ink);color:#f5f1e6;padding:14px;border-radius:10px;font-family:var(--mono);font-size:.78rem;line-height:1.6;overflow-x:auto;margin:10px 0;border-left:3px solid var(--gold);white-space:pre-wrap}
[data-theme="dark"] pre.code{background:#0a0a08}

/* EXTERNAL PLAYGROUND EXERCISES */
.ex-external{
  background:linear-gradient(135deg, var(--navyL) 0%, var(--surface2) 100%);
  border:1.5px solid #9bbed4;
  border-left:4px solid var(--navy);
}
.ex-external .ex-icon{background:var(--navy)}
.ex-external.solved .ex-icon{background:var(--green)}
.ex-target{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px; margin:10px 0; font-size:.86rem;
}
.ex-target h5{font-size:.78rem; text-transform:uppercase; letter-spacing:.5px; color:var(--navy); margin-bottom:6px; font-weight:700}
.ex-target ol, .ex-target ul{margin:6px 0 6px 22px}
.ex-target li{margin-bottom:4px}
.copy-block{
  background:var(--ink); color:#f5f1e6; padding:12px 14px; border-radius:8px;
  font-family:var(--mono); font-size:.78rem; line-height:1.55; margin:8px 0;
  position:relative; white-space:pre-wrap; border-left:3px solid var(--gold);
}
[data-theme="dark"] .copy-block{background:#0a0a08}
.copy-block-actions{position:absolute; top:6px; right:6px}
.copy-block-actions .btn-sm{padding:4px 10px; font-size:.7rem}
.llm-link-row{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0}
.llm-link{
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 12px; background:var(--surface); border:1.5px solid var(--border);
  border-radius:18px; font-size:.74rem; font-weight:600; text-decoration:none; color:var(--ink2);
  transition:all var(--t);
}
.llm-link:hover{border-color:var(--gold); background:var(--goldXL); color:#3a2a08; transform:translateY(-1px)}
[data-theme="dark"] .llm-link:hover{color:var(--gold2)}

/* HYPERPARAMETER VISUALIZER */
.hyper-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:14px 0}
@media (max-width:880px){.hyper-grid{grid-template-columns:1fr}}
.hyper-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px}
.hyper-card h5{font-size:.82rem; color:var(--gold); margin-bottom:6px; font-weight:700}
.hyper-card .hyper-meter{
  height:8px; background:var(--bg2); border-radius:4px; margin:8px 0; overflow:hidden;
}
.hyper-card .hyper-fill{height:100%; background:linear-gradient(to right, var(--green), var(--amber), var(--red)); transition:width .3s}

/* JSON SCHEMA BUILDER */
.schema-row{display:grid; grid-template-columns:2fr 1fr 1fr 30px; gap:6px; padding:6px; background:var(--surface2); border-radius:8px; margin-bottom:6px; align-items:center}
.schema-row input, .schema-row select{padding:6px 10px; font-size:.78rem}

/* AGENT FLOW DIAGRAM */
.agent-flow{display:flex; flex-direction:column; gap:10px; margin:14px 0}
.agent-node{
  background:var(--surface); border:2px solid var(--border); border-radius:12px;
  padding:12px 16px; display:flex; align-items:center; gap:12px;
  position:relative; transition:all var(--t);
}
.agent-node:not(:last-child)::after{
  content:'↓'; position:absolute; bottom:-18px; left:50%; transform:translateX(-50%);
  font-size:1.2rem; color:var(--gold); font-weight:700; z-index:1;
}
.agent-icon{
  width:42px; height:42px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:1.1rem; color:#fff; font-weight:700;
}
.agent-icon.orch{background:var(--gold)}
.agent-icon.retrieve{background:var(--navy)}
.agent-icon.quant{background:var(--green)}
.agent-icon.synth{background:var(--amber)}
.agent-icon.eval{background:var(--red)}
.agent-meta{flex:1; min-width:0}
.agent-name{font-weight:700; font-size:.9rem; color:var(--ink)}
.agent-desc{font-size:.78rem; color:var(--soft); margin-top:2px}

/* RESPONSIVE */
@media (max-width:980px){
  .sidebar{position:fixed;left:-300px;top:0;height:100%;transition:left .3s}
  .sidebar.open{left:0}
  .content{padding:24px 22px 80px}
  .mod-hero{padding:22px 22px}
  .mod-hero h2{font-size:1.5rem}
  .topbar{padding:12px 18px}
  .slider-row{grid-template-columns:1fr 60px;grid-template-areas:'a c' 'b b'}
  .slider-row .slider-label{grid-area:a}
  .slider-row .slider-val{grid-area:c}
  .slider-row input[type=range]{grid-area:b}
}
.menu-toggle{display:none;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--ink)}
@media (max-width:980px){.menu-toggle{display:block}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-logo">
      <div class="brand-mark">LV</div>
      <div>
        <div class="brand-title">Valuation Lab</div>
        <div class="brand-sub">Israeli CFO Masterclass</div>
      </div>
    </div>
  </div>
  <div class="progress-block">
    <div class="progress-row">
      <div class="ring" id="progRing" style="--pct:0;">
        <span class="ring-label" id="progLabel">0%</span>
      </div>
      <div class="progress-text">
        <strong><span id="progDone">0</span>/11 modules</strong>
        Curriculum mastery
      </div>
    </div>
    <div class="streak" id="streak" style="display:none">
      🔥 <span id="streakNum">0</span> exercises in a row
    </div>
  </div>
  <nav class="module-list" id="moduleList"></nav>
  <div class="sidebar-footer">
    <button class="tool-chip" onclick="App.openModal('glossary')">📖 Glossary</button>
    <button class="tool-chip" onclick="App.openModal('promptlib')">📝 Prompts</button>
    <button class="tool-chip" onclick="App.toggleTheme()">🌓 Theme</button>
    <button class="tool-chip" onclick="App.resetAll()">🔄 Reset</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <div class="topbar-l">
      <div class="topbar-crumbs" id="crumbs">Module 1 of 8</div>
      <h1 id="topTitle">Loading…</h1>
    </div>
    <div class="topbar-r">
      <button class="icon-btn" title="Glossary" onclick="App.openModal('glossary')">📖</button>
      <button class="icon-btn" title="Prompts" onclick="App.openModal('promptlib')">📝</button>
      <div class="score-pill"><span class="star">★</span> <span id="scoreNum">0</span> pts</div>
    </div>
  </div>
  <div class="content" id="content">
    <div class="content-inner" id="contentInner"></div>
  </div>
</main>

<div class="overlay" id="overlay" onclick="App.closeModal()"></div>
<div class="modal" id="modal">
  <div class="modal-head">
    <h3 id="modalTitle">Modal</h3>
    <button class="modal-close" onclick="App.closeModal()">✕</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="confetti" id="confetti"></div>

<script>
/* ===== APP STATE ===== */
const STORAGE_KEY = 'llmValuationLab.v2';
const App = {
  state: {
    currentModule: 0, score: 0, completed: new Set(),
    exercises: {}, streak: 0, answers: {}, theme: 'light',
  },
  save(){ try{
    const s=this.state;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      currentModule:s.currentModule, score:s.score, completed:[...s.completed],
      exercises:s.exercises, streak:s.streak, answers:s.answers, theme:s.theme,
    }));
  }catch(e){} },
  load(){ try{
    const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return;
    const d=JSON.parse(raw); const s=this.state;
    s.currentModule=d.currentModule||0; s.score=d.score||0;
    s.completed=new Set(d.completed||[]); s.exercises=d.exercises||{};
    s.streak=d.streak||0; s.answers=d.answers||{}; s.theme=d.theme||'light';
  }catch(e){} },
  toggleTheme(){
    this.state.theme = this.state.theme==='light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', this.state.theme);
    this.save();
  },
  award(pts, reason){
    this.state.score += pts; this.state.streak += 1;
    this.updateProgress();
    this.toast(`+${pts} pts · ${reason}`, 'gold');
    if(this.state.streak>=3){
      const el=document.getElementById('streak');
      el.style.display='flex';
      document.getElementById('streakNum').textContent=this.state.streak;
    }
  },
  resetStreak(){ this.state.streak=0; document.getElementById('streak').style.display='none'; },
  updateProgress(){
    const pct=(this.state.completed.size/MODULES.length)*100;
    const r=document.getElementById('progRing');
    r.style.setProperty('--pct', pct);
    document.getElementById('progLabel').textContent=Math.round(pct)+'%';
    document.getElementById('progDone').textContent=this.state.completed.size;
    document.getElementById('scoreNum').textContent=this.state.score;
    this.renderSidebar(); this.save();
  },
  exKey(m,e){return m+'_'+e},
  getEx(m,e){
    const k=this.exKey(m,e);
    if(!this.state.exercises[k]) this.state.exercises[k]={solved:false,attempts:0,hintsShown:0};
    return this.state.exercises[k];
  },
  solveEx(m,e,pts,reason){
    const x=this.getEx(m,e); if(x.solved) return;
    x.solved=true; this.award(pts, reason||'Correct');
    this.checkModuleComplete(m); this.save();
  },
  checkModuleComplete(m){
    const req=(MODULES[m].required||[]); if(!req.length) return;
    const all=req.every(id=>this.getEx(m,id).solved);
    if(all && !this.state.completed.has(m)){
      this.state.completed.add(m); this.updateProgress();
      this.toast('✅ Module complete: '+MODULES[m].title, 'navy');
      this.fireConfetti();
      if(this.state.completed.size===MODULES.length){
        setTimeout(()=> this.toast('🏆 LAB COMPLETE — Certified LLM Valuation Practitioner', 'gold'), 600);
      }
    }
  },
  toast(msg, kind){
    const w=document.getElementById('toastWrap');
    const el=document.createElement('div');
    el.className='toast '+(kind||''); el.textContent=msg;
    w.appendChild(el); setTimeout(()=> el.remove(), 3000);
  },
  fireConfetti(){
    const wrap=document.getElementById('confetti'); wrap.innerHTML='';
    const colors=['#9a7209','#c49a1f','#0c405b','#155d80','#2c6e49','#b97f08'];
    for(let i=0;i<60;i++){
      const s=document.createElement('span');
      s.style.left=Math.random()*100+'%';
      s.style.background=colors[i%colors.length];
      s.style.animationDelay=(Math.random()*.4)+'s';
      s.style.animationDuration=(1.6+Math.random()*1.2)+'s';
      s.style.transform='rotate('+(Math.random()*360)+'deg)';
      wrap.appendChild(s);
    }
    wrap.classList.add('go');
    setTimeout(()=> wrap.classList.remove('go'), 2800);
  },
  goTo(idx){
    if(idx<0||idx>=MODULES.length) return;
    this.state.currentModule=idx; this.renderModule(idx);
    document.getElementById('content').scrollTop=0;
    if(window.innerWidth<=980) document.getElementById('sidebar').classList.remove('open');
    this.save();
  },
  renderSidebar(){
    const list=document.getElementById('moduleList'); list.innerHTML='';
    MODULES.forEach((m,i)=>{
      const div=document.createElement('div');
      div.className='mod-item'+(i===this.state.currentModule?' active':'')+(this.state.completed.has(i)?' completed':'');
      div.innerHTML=`<span class="mod-num">${this.state.completed.has(i)?'✓':(i+1)}</span><span class="mod-meta"><span class="mod-title-text">${m.title}</span><span class="mod-time">${m.time}</span></span>`;
      div.onclick=()=> this.goTo(i);
      list.appendChild(div);
    });
  },
  renderModule(idx){
    const m=MODULES[idx];
    document.getElementById('topTitle').textContent=m.title;
    document.getElementById('crumbs').textContent=`Module ${idx+1} of ${MODULES.length} · ${m.time}`;
    const inner=document.getElementById('contentInner');
    inner.innerHTML=`<div class="module-view active" id="mv">${m.render()}</div>`;
    if(m.afterRender) setTimeout(()=> m.afterRender(), 30);
    setTimeout(()=>{
      // restore answers
      Object.keys(this.state.answers).forEach(k=>{
        if(k.startsWith(idx+'_')){
          const id=k.substring(k.indexOf('_')+1);
          const el=document.getElementById('input_'+id);
          if(el) el.value=this.state.answers[k];
          if(el && el.tagName==='TEXTAREA'){
            const cnt=document.getElementById('cnt_'+id);
            if(cnt) cnt.textContent=(el.value||'').length;
          }
        }
      });
      // restore solved
      Object.keys(this.state.exercises).forEach(k=>{
        if(k.startsWith(idx+'_') && this.state.exercises[k].solved){
          const id=k.substring(k.indexOf('_')+1);
          const el=document.getElementById('ex_'+id);
          if(el) el.classList.add('solved');
        }
      });
    }, 60);
    this.renderSidebar();
  },
  openModal(kind){
    const t=document.getElementById('modalTitle'); const b=document.getElementById('modalBody');
    if(kind==='glossary'){
      t.textContent='📖 Valuation & LLM Glossary';
      b.innerHTML=GLOSSARY.map(g=>`<dt>${g.term}</dt><dd>${g.def}</dd>`).join('');
    } else if(kind==='promptlib'){
      t.textContent='📝 Prompt Library — Copy & Adapt';
      b.innerHTML=PROMPTLIB.map((p,i)=>`<div style="margin-bottom:18px"><h4 style="font-family:var(--serif);color:var(--gold);margin-bottom:6px">${p.title}</h4><div style="font-size:.82rem;color:var(--soft);margin-bottom:6px">${p.use}</div><pre class="code">${p.body.replace(/</g,'&lt;')}</pre><button class="btn btn-o btn-sm" onclick="App.copyPrompt(${i})">📋 Copy</button></div>`).join('');
    }
    document.getElementById('modal').classList.add('open');
    document.getElementById('overlay').classList.add('open');
  },
  copyPrompt(i){
    navigator.clipboard.writeText(PROMPTLIB[i].body);
    this.toast('Copied to clipboard','navy');
  },
  closeModal(){
    document.getElementById('modal').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  },
  resetAll(){
    if(!confirm('Reset all progress?')) return;
    localStorage.removeItem(STORAGE_KEY); location.reload();
  },
};

/* ===== EXERCISE FACTORIES ===== */
const Ex = {
  mc(modIdx, id, pts, opts){
    setTimeout(()=>{
      const el=document.getElementById('ex_'+id); if(!el) return;
      el.querySelectorAll('input[type="radio"]').forEach(r=>{
        r.addEventListener('change', e=>{
          el.querySelectorAll('label').forEach(l=> l.classList.remove('picked'));
          e.target.parentElement.classList.add('picked');
        });
      });
    }, 60);
    const choicesJson=JSON.stringify(opts.choices).replace(/"/g,'&quot;');
    const hintsJson=opts.hints?JSON.stringify(opts.hints).replace(/"/g,'&quot;'):'null';
    const solJson=opts.solution?JSON.stringify(opts.solution).replace(/"/g,'&quot;'):'null';
    return `<div class="ex" id="ex_${id}">
      <div class="ex-head"><div class="ex-title"><div class="ex-icon">?</div><h4>${opts.question}</h4></div><span class="ex-pts">${pts} pts</span></div>
      ${opts.intro?`<div class="ex-instructions">${opts.intro}</div>`:''}
      <div class="opts" id="opts_${id}">${opts.choices.map(c=>`<label><input type="radio" name="r_${id}" value="${c.value}"> ${c.label}</label>`).join('')}</div>
      <div class="ex-actions">
        <button class="btn btn-g btn-sm" onclick="Ex.checkMC(${modIdx},'${id}','${opts.correct}',${pts}, ${choicesJson})">Check Answer</button>
        ${opts.hints?`<button class="btn btn-ghost btn-sm" onclick="Ex.showHint('${id}', ${hintsJson})">💡 Hint</button>`:''}
        ${opts.solution?`<button class="btn btn-o btn-sm" onclick="Ex.showSolution('${id}', ${solJson})">🎓 Solution</button>`:''}
      </div>
      <div class="hint-stack" id="hints_${id}"></div>
      <div class="feedback" id="fb_${id}"></div>
    </div>`;
  },
  checkMC(modIdx, id, correct, pts, choices){
    const sel=document.querySelector(`input[name="r_${id}"]:checked`);
    const fb=document.getElementById('fb_'+id);
    const ex=App.getEx(modIdx, id); ex.attempts++;
    if(!sel){ fb.className='feedback show bad'; fb.textContent='⚠️ Pick an option first.'; return; }
    const labels=document.querySelectorAll(`#opts_${id} label`);
    labels.forEach(l=>{
      const inp=l.querySelector('input'); l.classList.remove('right','wrong');
      if(inp.value===correct) l.classList.add('right');
      else if(inp.checked) l.classList.add('wrong');
    });
    if(sel.value===correct){
      const choice=(choices||[]).find(c=>c.value===correct);
      fb.className='feedback show ok';
      fb.innerHTML=`✅ <strong>Correct!</strong> ${choice && choice.explain ? choice.explain : ''}`;
      labels.forEach(l=> l.classList.add('disabled'));
      App.solveEx(modIdx, id, pts);
      document.getElementById('ex_'+id).classList.add('solved');
    } else {
      App.resetStreak();
      const choice=(choices||[]).find(c=>c.value===sel.value);
      fb.className='feedback show bad';
      fb.innerHTML=`❌ Not quite. ${choice && choice.explain ? choice.explain : 'Try again.'}`;
      setTimeout(()=>{ labels.forEach(l=> l.classList.remove('right','wrong')); sel.checked=false; }, 1800);
    }
  },
  num(modIdx, id, pts, opts){
    const hintsJson=opts.hints?JSON.stringify(opts.hints).replace(/"/g,'&quot;'):'null';
    const solJson=opts.solution?JSON.stringify(opts.solution).replace(/"/g,'&quot;'):'null';
    return `<div class="ex" id="ex_${id}">

  _initDnd(id){
    const root=document.getElementById('ex_'+id); if(!root) return;
    root.querySelectorAll('.dnd-item').forEach(item=>{
      item.addEventListener('dragstart', e=>{
        e.dataTransfer.setData('text/plain', item.dataset.id);
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', ()=> item.classList.remove('dragging'));
    });
    root.querySelectorAll('.dnd-zone, .dnd-source').forEach(zone=>{
      zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('over'); });
      zone.addEventListener('dragleave', e=> zone.classList.remove('over'));
      zone.addEventListener('drop', e=>{
        e.preventDefault(); zone.classList.remove('over');
        const dragId=e.dataTransfer.getData('text/plain');
        const dragged=root.querySelector(`.dnd-item[data-id="${dragId}"]`);
        if(!dragged) return;
        const target=zone.classList.contains('dnd-zone') ? zone.querySelector('.dnd-zone-body') : zone;
        target.appendChild(dragged);
      });
    });
  },
  checkDnd(modIdx, id, pts){
    const root=document.getElementById('ex_'+id);
    let correct=0, total=0;
    root.querySelectorAll('.dnd-item').forEach(item=>{
      total++;
      const parent=item.closest('[data-zone]');
      const placedZone=parent ? parent.dataset.zone : null;
      const correctZone=item.dataset.answer;
      const wrap=parent && parent.classList.contains('dnd-zone') ? parent : parent?.parentElement;
      if(placedZone===correctZone){ correct++; if(wrap){ wrap.classList.add('right'); wrap.classList.remove('wrong'); } }
      else if(wrap && wrap.classList.contains('dnd-zone')){ wrap.classList.add('wrong'); wrap.classList.remove('right'); }
    });
    const fb=document.getElementById('fb_'+id);
    if(correct===total){
      fb.className='feedback show ok';
      fb.innerHTML=`✅ <strong>All ${total} matches correct.</strong>`;
      App.solveEx(modIdx, id, pts);
      document.getElementById('ex_'+id).classList.add('solved');
    } else {
      App.resetStreak();
      fb.className='feedback show bad';
      fb.innerHTML=`❌ <strong>${correct}/${total} correct.</strong> Adjust placements.`;
    }
  },
  resetDnd(id){
    const root=document.getElementById('ex_'+id);
    const src=document.getElementById('src_'+id);
    root.querySelectorAll('.dnd-item').forEach(i=> src.appendChild(i));
    root.querySelectorAll('.dnd-zone').forEach(z=> z.classList.remove('right','wrong'));
    document.getElementById('fb_'+id).className='feedback';

/* ===== GLOSSARY ===== */
const GLOSSARY = [
  {term:'Enterprise Value (EV)', def:'Equity Value + Total Debt − Cash & Equivalents + Minority Interest + Preferred. The takeover price of the operating business.'},
  {term:'Equity Value', def:'Value to common shareholders. EV − Net Debt − Minority Interest − Preferred. Divide by diluted shares for per-share.'},
  {term:'EBITDA', def:'Earnings Before Interest, Taxes, Depreciation & Amortization. Cash-operating proxy; ignores capex, NWC changes, SBC.'},
  {term:'EV/EBITDA', def:'Most common multiple. Capital-structure neutral. Watch: non-recurring items, R&D capitalization, IFRS 16 vs ASC 842 lease accounting.'},
  {term:'WACC', def:'(E/V × Re) + (D/V × Rd × (1−T)). The discount rate for FCFF.'},
  {term:'CAPM', def:'Re = Rf + β × ERP. Israeli inputs (Apr 2026): Rf ≈ 4.0–4.5%, ERP ≈ 5.5–6.5%, β industry-specific.'},
  {term:'Beta (β)', def:'Volatility vs. market. Levered β reflects capital structure; unlever then re-lever to target structure for private companies.'},
  {term:'ERP', def:'Equity Risk Premium. Excess return demanded over Rf. For Israel, country risk often added to mature ERP (~5.5%).'},
  {term:'Risk-Free Rate (Rf)', def:'Long-term gov bond yield matching cash-flow currency. Israel 10Y ≈ 4.0–4.5% in early 2026.'},
  {term:'DCF', def:'Discounted Cash Flow. Project FCFFs (5–10 yrs), discount at WACC, add Terminal Value.'},
  {term:'FCFF', def:'NOPAT + D&A − Capex − ΔNWC. Used with WACC for Enterprise Value.'},
  {term:'FCFE', def:'FCFF − After-tax Interest + Net Borrowing. Used with Cost of Equity for Equity Value directly.'},
  {term:'NOPAT', def:'EBIT × (1 − T). Israel statutory T = 23% (2026); preferred-enterprise regimes can reduce to 7.5–16%.'},
  {term:'Terminal Value', def:'Value beyond explicit forecast. Gordon: TV = FCFF_n × (1+g) / (WACC − g). Exit Multiple: TV = EBITDA_n × multiple.'},
  {term:'DLOM', def:'Discount for Lack of Marketability. Israeli private: 20–35% typical. Methods: Chaffe (option), Finnerty, restricted-stock studies.'},
  {term:'DLOC', def:'Discount for Lack of Control. Minority stake adjustment. Typical 10–25%.'},
  {term:'NAV', def:'Net Asset Value. Σ fair-value assets − liabilities. Common for holdcos, real estate, family offices.'},
  {term:'Israel Corporate Tax', def:'23% statutory (2026). Preferred Enterprise: 7.5%–16% for qualifying R&D.'},
  {term:'TASE', def:'Tel Aviv Stock Exchange. Indices: TA-35, TA-90, TA-125. Heavily weighted to banks and tech.'},
  {term:'MNPI', def:'Material Non-Public Information. Cannot leave the company without legal review and proper safeguards. NEVER paste into a public LLM.'},
  {term:'PII', def:'Personally Identifiable Information. Must be stripped before any LLM call without DPA.'},
  {term:'DPA', def:'Data Processing Agreement. Contractual basis for sharing personal data with vendors. Required under Israeli PPL and GDPR.'},
  {term:'Hallucination', def:'LLM output that is fluent but factually wrong. Common in: ticker→multiple lookups, historical numbers, regulation names, specific dates.'},
  {term:'Prompt Injection', def:'Adversarial text in documents/emails that hijacks LLM behavior. Critical risk for agents that pipe untrusted input.'},
  {term:'Self-hosted LLM', def:'Open-weights model (DeepSeek, Qwen, GLM, Llama) on your own infra. Recommended for MNPI and IP-sensitive analysis.'},
  {term:'Israeli Privacy Protection Law', def:'1981 + 2024 amendment. DPA, breach notification, DPO for large processors. Significant fines.'},
  {term:'ISA Cyber Circular', def:'Israeli Securities Authority directive on cyber risk for issuers/licensees. Bears on AI vendor due-diligence.'},
];

/* ===== SANITIZE SANDBOX ===== */
function sanitizeRun(){
  const txt=document.getElementById('sanInput').value;
  if(!txt.trim()){ document.getElementById('sanOut').innerHTML='<em style="color:var(--soft)">Paste text first.</em>'; return; }
  let out=txt;
  // Currency amounts
  out=out.replace(/\$([\d,]+(\.\d+)?)\s*(million|m|billion|b)?/gi, m=>`<span class="flag" title="Specific amount → range">${m}</span> <span class="flag-clean">~$[range]</span>`);
  out=out.replace(/₪([\d,]+(\.\d+)?)\s*(מ׳|מיליון|m)?/gi, m=>`<span class="flag" title="Shekel amount">${m}</span> <span class="flag-clean">~₪[range]</span>`);
  // Percentages with high specificity
  out=out.replace(/\b\d{2,3}\.\d{1,2}%/g, m=>`<span class="flag" title="Specific %">${m}</span> <span class="flag-clean">~[range]%</span>`);
  // Capitalized company-like terms (3+ chars, not common words)
  const stop=['the','and','our','for','with','this','that','from','have','will','were','been','they','their','what','when','where','which','company','board','quarter','year','revenue','ebitda','israel','israeli','tase','nasdaq'];
  out=out.replace(/\b([A-Z][a-zA-Z]{2,})(\s+(?:Ltd|Inc|Corp|Co|Group|Capital|Holdings|Industries|Technologies|Tech|Cyber|Pharma)\.?)?/g, (m,p1)=>{
    if(stop.includes(p1.toLowerCase())) return m;
    return `<span class="flag" title="Possible name">${m}</span>`;
  });
  // Dates
  out=out.replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{1,2}(,?\s+\d{4})?/gi, m=>`<span class="flag" title="Specific date">${m}</span>`);
  // Email
  out=out.replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g, m=>`<span class="flag" title="Email (PII)">${m}</span>`);
  // ID numbers (long digit strings)
  out=out.replace(/\b\d{6,}\b/g, m=>`<span class="flag" title="Long number — possible ID">${m}</span>`);
  document.getElementById('sanOut').innerHTML=out;
}

let _schemaFields = [];
const SCHEMA_PRESETS = {
  default: [
    {name:'company_name', type:'string', required:true},
    {name:'period', type:'string', required:true},
    {name:'revenue_m', type:'float', required:true},
    {name:'ebitda_m', type:'float', required:false},
    {name:'confidence', type:'enum', required:true, values:'HIGH|MEDIUM|LOW'},
  ],
  liquidity: [
    {name:'company_name', type:'string', required:true},
    {name:'period', type:'string', required:true},
    {name:'cash_and_equivalents_m', type:'float', required:true},
    {name:'short_term_debt_m', type:'float', required:true},
    {name:'revolving_credit_drawn_m', type:'float', required:false},
    {name:'revolving_credit_capacity_m', type:'float', required:false},
    {name:'covenant_status', type:'enum', required:true, values:'IN_COMPLIANCE|WAIVER_ACTIVE|BREACHED|UNKNOWN'},
    {name:'mgmt_commentary', type:'string', required:false},
  ],
  iia: [
    {name:'grant_program', type:'string', required:true},
    {name:'grant_amount_ils_m', type:'float', required:true},
    {name:'royalty_rate_pct', type:'float', required:true},
    {name:'royalty_cap_multiple', type:'float', required:true},
    {name:'ip_transfer_penalty_multiple', type:'float', required:true},
    {name:'mandatory_iia_consent_required', type:'bool', required:true},
    {name:'change_of_control_trigger', type:'bool', required:true},
    {name:'cited_paragraph', type:'string', required:true},
  ],
};
function schemaInit(){
  if(_schemaFields.length===0) _schemaFields = JSON.parse(JSON.stringify(SCHEMA_PRESETS.default));
  schemaRender();
}
function schemaRender(){
  const t = document.getElementById('schemaTable'); if(!t) return;
  t.innerHTML = _schemaFields.map((f,i)=>`
    <div class="schema-row">
      <input type="text" value="${f.name}" placeholder="field_name" oninput="_schemaFields[${i}].name=this.value">
      <select onchange="_schemaFields[${i}].type=this.value">
        <option value="string"${f.type==='string'?' selected':''}>string</option>
        <option value="float"${f.type==='float'?' selected':''}>float</option>
        <option value="int"${f.type==='int'?' selected':''}>int</option>
        <option value="bool"${f.type==='bool'?' selected':''}>bool</option>
        <option value="enum"${f.type==='enum'?' selected':''}>enum</option>
        <option value="array"${f.type==='array'?' selected':''}>array</option>
      </select>
      <select onchange="_schemaFields[${i}].required=this.value==='true'">
        <option value="true"${f.required?' selected':''}>required</option>
        <option value="false"${!f.required?' selected':''}>optional</option>
      </select>
      <button class="x-btn" onclick="_schemaFields.splice(${i},1);schemaRender()">✕</button>
    </div>`).join('');
}
function schemaAdd(){ _schemaFields.push({name:'new_field', type:'string', required:false}); schemaRender(); }
function schemaReset(){ _schemaFields = JSON.parse(JSON.stringify(SCHEMA_PRESETS.default)); schemaRender(); }
function schemaLoad(name){ _schemaFields = JSON.parse(JSON.stringify(SCHEMA_PRESETS[name])); schemaRender(); }
function schemaGenerate(){
  const src = document.getElementById('schemaSource').value;
  const lines = _schemaFields.map(f=>{
    let typ;
    if(f.type==='string') typ = f.required ? 'string' : 'string | "DATA_UNAVAILABLE"';
    else if(f.type==='float') typ = 'float | null';
    else if(f.type==='int') typ = 'integer | null';
    else if(f.type==='bool') typ = 'boolean';
    else if(f.type==='enum') typ = (f.values||'').split('|').map(v=>`"${v.trim()}"`).join(' | ');
    else if(f.type==='array') typ = 'array of strings';
    else typ = f.type;
    return `  "${f.name}": ${typ}${f.required?'':' (optional)'}`;
  }).join(',\n');
  const prompt = `You are a specialized financial parsing engine.

RULES:
1. Use ONLY information explicitly provided in the user prompt below. Do NOT use pre-trained knowledge.
2. If a required value is not present, return "DATA_UNAVAILABLE" (for strings) or null (for numbers).
3. Output ONLY raw JSON conforming to the schema below — no preamble, no markdown fencing.
4. All amounts are in $M as floats unless otherwise stated.
5. Provide a confidence rating; surface gaps in a "data_gaps" array.

SCHEMA:
{
${lines}
}

SOURCE TEXT:
"""
${src}
"""

OUTPUT (JSON only):`;
  document.getElementById('schemaOut').textContent = prompt;
}
function schemaCopy(){
  navigator.clipboard.writeText(document.getElementById('schemaOut').textContent);
  App.toast('Prompt copied — paste into your LLM','navy');
}

          <li><strong>Buyer pool.</strong> Public buyers number in millions. Private buyers number in dozens for any specific asset.</li>
          <li><strong>Comparability.</strong> Listed peers may be 10× larger, more diversified, multi-geo. Adjustments needed.</li>
        </ol>

      <h3 class="section-title">The discount stack</h3>
      <p>Practitioners decompose the public-to-private gap into named discounts. These are not all multiplicative; you need judgment about which apply.</p>

        <thead><tr><th>Discount</th><th>Typical (Israel)</th><th>What it captures</th></tr></thead>

let _compData = [];
function compInit(){
  if(_compData.length===0) _compData = [8.2, 7.8, 6.5, 9.1, 5.9, 7.1, 8.5, 6.8];

function compRender(){
  const t = document.getElementById('compTable'); if(!t) return;
  t.innerHTML = _compData.map((v,i)=>`
    <div class="builder-row">
      <input type="text" value="Peer ${i+1}" readonly style="background:var(--bg2);font-weight:600;color:var(--ink2)">
      <input type="number" step="0.1" value="${v}" oninput="_compData[${i}]=parseFloat(this.value)||0;compRecalc()">
      <span style="color:var(--soft);font-size:.78rem">×</span>
      <button class="x-btn" onclick="_compData.splice(${i},1);compRender()">✕</button>
    </div>`).join('');
  compRecalc();
}
function compAdd(){ _compData.push(7.0); compRender(); }
function compReset(){ _compData = [8.2, 7.8, 6.5, 9.1, 5.9, 7.1, 8.5, 6.8]; compRender(); }
function compRecalc(){
  const arr = _compData.filter(x=>!isNaN(x) && x>0);
  if(arr.length===0) return;
  const sorted = [...arr].sort((a,b)=>a-b);
  const mean = arr.reduce((a,b)=>a+b,0)/arr.length;
  const mid = Math.floor(sorted.length/2);
  const median = sorted.length%2 ? sorted[mid] : (sorted[mid-1]+sorted[mid])/2;
  const harm = arr.length / arr.reduce((a,b)=>a + 1/b, 0);
  const mn = sorted[0], mx = sorted[sorted.length-1];
  // IQR
  const q1 = sorted[Math.floor(sorted.length*0.25)];
  const q3 = sorted[Math.floor(sorted.length*0.75)];
  const iqr = q3 - q1;
  const lo = q1 - 1.5*iqr, hi = q3 + 1.5*iqr;
  const outliers = arr.filter(x => x<lo || x>hi);
  const dlom = parseFloat(document.getElementById('cmpDlom').value)/100;
  const dloc = parseFloat(document.getElementById('cmpDloc').value)/100;
  const ebit = parseFloat(document.getElementById('cmpEbit').value);
  document.getElementById('cmpDlomV').textContent = (dlom*100).toFixed(0)+'%';
  document.getElementById('cmpDlocV').textContent = (dloc*100).toFixed(0)+'%';
  document.getElementById('cmpEbitV').textContent = '$'+ebit+'M';
  const imp = median * (1-dlom) * (1-dloc);
  const ev = imp * ebit;
  document.getElementById('oMean').textContent = mean.toFixed(2)+'×';
  document.getElementById('oMedian').textContent = median.toFixed(2)+'×';
  document.getElementById('oHarm').textContent = harm.toFixed(2)+'×';
  document.getElementById('oMinmax').textContent = mn.toFixed(2)+'× / '+mx.toFixed(2)+'×';
  document.getElementById('oOut').textContent = outliers.length ? outliers.map(o=>o.toFixed(1)+'×').join(', ') : 'none';
  document.getElementById('oImp').textContent = imp.toFixed(2)+'×';
  document.getElementById('oEv').textContent = '$'+ev.toFixed(1)+'M';
}

function navRecalc(){

  const netAssets = gross - dlomLoss;

  const grossNav = netAssets - liab;
  const holdco = parseFloat(document.getElementById('navHoldco').value)/100;
  document.getElementById('navHoldcoV').textContent = (holdco*100).toFixed(0)+'%';
  const holdcoVal = grossNav * holdco;
  const final = grossNav - holdcoVal;
  document.getElementById('navAssetsTotal').textContent = '₪'+gross.toFixed(2);
  document.getElementById('navDlomTotal').textContent = '−₪'+dlomLoss.toFixed(2);
  document.getElementById('navAssetsNet').textContent = '₪'+netAssets.toFixed(2);
  document.getElementById('navLiabTotal').textContent = '−₪'+liab.toFixed(2);
  document.getElementById('navGross').textContent = '₪'+grossNav.toFixed(2);
  document.getElementById('navHoldcoVal').textContent = '−₪'+holdcoVal.toFixed(2);
  document.getElementById('navFinal').textContent = '₪'+final.toFixed(2);
}

  const erp = get('d_erp')/100;
  const beta = get('d_b');
  const rd = get('d_rd')/100;
  const dv = get('d_dv')/100;
  const gt = get('d_gt')/100;
  const nd = get('d_nd');
  const T = 0.23; // Israel
  // labels
  document.getElementById('d_revV').textContent = '$'+rev1+'M';
  document.getElementById('d_g1V').textContent = (g1*100).toFixed(0)+'%';
  document.getElementById('d_m1V').textContent = (m1*100).toFixed(0)+'%';
  document.getElementById('d_mtV').textContent = (mt*100).toFixed(0)+'%';
  document.getElementById('d_cxV').textContent = (cx*100).toFixed(1)+'%';
  document.getElementById('d_nwcV').textContent = (nwc*100).toFixed(0)+'%';
  document.getElementById('d_rfV').textContent = (rf*100).toFixed(1)+'%';
  document.getElementById('d_erpV').textContent = (erp*100).toFixed(1)+'%';
  document.getElementById('d_bV').textContent = beta.toFixed(2);
  document.getElementById('d_rdV').textContent = (rd*100).toFixed(1)+'%';
  document.getElementById('d_dvV').textContent = (dv*100).toFixed(0)+'%';
  document.getElementById('d_gtV').textContent = (gt*100).toFixed(1)+'%';
  document.getElementById('d_ndV').textContent = '$'+nd+'M';

  const re = rf + beta * erp;
  const rdAt = rd * (1 - T);
  const wacc = (1 - dv) * re + dv * rdAt;

  // 5-year explicit projection, linear interpolation of growth and margin
  const N = 5;
  let revs = [], fcffs = [], pvFcffs = [];
  let prevRev = rev1 / (1 + g1); // implicit "year 0" for ΔNWC computation? Use rev1 directly as year-1.
  for(let t=1; t<=N; t++){
    const gt_t = g1 + (gt - g1) * (t-1) / (N-1);
    const mt_t = m1 + (mt - m1) * (t-1) / (N-1);
    const rev = (t===1) ? rev1 : revs[t-2] * (1 + gt_t);
    revs.push(rev);
    const ebitda = rev * mt_t;
    const da = rev * (cx * 0.7); // simplification: D&A ≈ 70% of capex steady-state
    const ebit = ebitda - da;
    const nopat = ebit * (1 - T);
    const capex = rev * cx;
    const dRev = (t===1) ? (rev - prevRev) : (rev - revs[t-2]);
    const dNwc = dRev * nwc;
    const fcff = nopat + da - capex - dNwc;
    fcffs.push(fcff);
    pvFcffs.push(fcff / Math.pow(1 + wacc, t));
  }
  const sumPv = pvFcffs.reduce((a,b)=>a+b, 0);
  const fcff5 = fcffs[N-1];
  let tv;
  if(wacc - gt <= 0.001){
    tv = NaN;
  } else {
    tv = fcff5 * (1 + gt) / (wacc - gt);
  }
  const pvTv = isNaN(tv) ? NaN : tv / Math.pow(1 + wacc, N);
  const ev = sumPv + (isNaN(pvTv) ? 0 : pvTv);
  const eq = ev - nd;
  const tvPct = (isNaN(pvTv) || ev<=0) ? NaN : pvTv / ev * 100;

  document.getElementById('o_re').textContent = (re*100).toFixed(2)+'%';
  document.getElementById('o_rdat').textContent = (rdAt*100).toFixed(2)+'%';
  document.getElementById('o_wacc').textContent = (wacc*100).toFixed(2)+'%';
  document.getElementById('o_pvfcff').textContent = '$'+sumPv.toFixed(1)+'M';
  document.getElementById('o_tv').textContent = isNaN(tv) ? '⚠️ g≥WACC' : '$'+tv.toFixed(1)+'M';
  document.getElementById('o_pvtv').textContent = isNaN(pvTv) ? '—' : '$'+pvTv.toFixed(1)+'M';
  document.getElementById('o_tvpct').textContent = isNaN(tvPct) ? '—' : tvPct.toFixed(1)+'%';
  document.getElementById('o_ev').textContent = '$'+ev.toFixed(1)+'M';
  document.getElementById('o_eq').textContent = '$'+eq.toFixed(1)+'M';

  // sensitivity heatmap: 5 WACC rows × 5 g cols around current
  const heat = document.getElementById('dcfHeat');
  if(!heat) return;
  const waccs = [-0.02, -0.01, 0, 0.01, 0.02].map(d => wacc + d);
  const gs = [-0.01, -0.005, 0, 0.005, 0.01].map(d => gt + d);
  let html = '<div class="heat-cell head"></div>';
  gs.forEach(g => html += `<div class="heat-cell head">g=${(g*100).toFixed(1)}%</div>`);
  // for each wacc row
  waccs.forEach(w => {
    html += `<div class="heat-cell label">WACC ${(w*100).toFixed(1)}%</div>`;
    gs.forEach(g => {
      // recompute EV
      const sumPv2 = fcffs.map((f,i)=> f / Math.pow(1+w, i+1)).reduce((a,b)=>a+b, 0);
      let tv2 = (w - g) > 0.001 ? fcffs[N-1] * (1+g) / (w - g) : NaN;
      const pvTv2 = isNaN(tv2) ? 0 : tv2 / Math.pow(1+w, N);
      const ev2 = sumPv2 + pvTv2;
      // color: scale relative to current ev
      const ratio = ev2 / Math.max(ev, 1);
      const r = Math.round(220 - Math.min(80, ratio * 30));
      const g_ = Math.round(180 + Math.min(40, ratio * 8));
      const b_ = Math.round(120 + Math.min(60, ratio * 12));
      const bg = `hsl(${ratio>1?140:30}, 50%, ${Math.max(50, 90 - Math.abs(ratio-1)*40)}%)`;
      html += `<div class="heat-cell" style="background:${bg}">${isNaN(tv2)?'—':'$'+ev2.toFixed(0)}</div>`;
    });
  });
  heat.innerHTML = html;
}

/* Prompt Lab */
function plRender(){
  const role = document.getElementById('pl_role')?.value || '';
  const task = document.getElementById('pl_task')?.value || '';
  const fmt = document.getElementById('pl_fmt')?.value || '';
  const tone = document.getElementById('pl_tone')?.value || '';
  const ctx = document.getElementById('pl_ctx')?.value || '';
  const c1 = document.getElementById('pl_c1')?.checked;
  const c2 = document.getElementById('pl_c2')?.checked;
  const c3 = document.getElementById('pl_c3')?.checked;
  const c4 = document.getElementById('pl_c4')?.checked;
  if(!role) return;
  let p = `You are a ${role.toLowerCase()}.\n\n`;
  p += `TASK: ${task}.\n\n`;
  if(ctx.trim()) p += `CONTEXT:\n${ctx.trim()}\n\n`;
  p += `OUTPUT FORMAT: ${fmt}.\n\n`;
  p += `TONE: ${tone}.\n\n`;
  const constraints = [];
  if(c1) constraints.push('Do NOT invent or estimate live market numbers (multiples, prices, rates). State explicitly when a value would need to be verified in CapIQ/Bloomberg/Damodaran.');
  if(c2) constraints.push('Flag every claim with a confidence indicator: [HIGH], [MEDIUM], [LOW].');
  if(c3) constraints.push('Where Israeli market specifics apply (TASE, Israeli tax law, ILA leasehold, IFRS 16, ISA regulations), call them out explicitly.');
  if(c4) constraints.push('Output in Hebrew.');
  if(constraints.length){
    p += `CONSTRAINTS:\n${constraints.map((c,i)=>`${i+1}. ${c}`).join('\n')}\n\n`;
  }
  p += `Begin.`;
  document.getElementById('plOut').textContent = p;
}
function plCopy(){
  const txt = document.getElementById('plOut').textContent;
  navigator.clipboard.writeText(txt);
  App.toast('Prompt copied to clipboard','navy');
}

/* ===== INIT ===== */
function _init(){
  App.load();
  document.documentElement.setAttribute('data-theme', App.state.theme);
  App.renderSidebar();
  App.goTo(App.state.currentModule||0);
  App.updateProgress();
}
// Boot
_init();
</script>
